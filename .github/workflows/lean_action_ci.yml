name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
      - name: Kernel replay of headline modules
        run: |
          lake env leanchecker AmericanPutConvexity.Stopping.PhysicalBoundaryCurvature
          lake env leanchecker AmericanPutConvexity.Stopping.AEHorizonCurvature
          lake env leanchecker AmericanPutConvexity.Stopping.PhysicalBoundaryConvexity
