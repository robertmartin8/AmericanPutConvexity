version: v0.4
project:
  name: Log-convexity of the exercise boundary of an American put option
  description: >-
    In the constant-parameter Black–Scholes model, the logarithm of the American
    put option exercise boundary is convex in positive time-to-expiry when
    the strike, risk-free interest rate and volatility are positive and the
    dividend yield satisfies 0 ≤ q ≤ r. The stock-price exercise boundary is
    strictly convex. The boundary is defined from a supremum over all stopping
    times bounded by the horizon almost surely, on a constructed Brownian
    probability space with its completed usual natural filtration. Model
    certificates, value bounds, boundary positivity and the payoff-contact
    characterization are included. This registration target is geometric;
    it does not assert classical second derivatives or strict log-convexity.
  authors: [Robert Martin]
  responsible_maintainers: [Robert Martin]
  license: Apache-2.0
classification:
  arxiv: [q-fin.PR, math.AP]
  msc2020: [91G20, 35R35]
sources:
  - title: Log-convexity of the exercise boundary of an American put option
    authors: [Robert Martin]
    type: paper
    relationship: formalizes
    url: https://github.com/robertmartin8/AmericanPutConvexity/blob/39e84b318a9efba3fc870582163f2e35f58302a2/paper/log-convexity.pdf
    author_endorsement: participated
    note: >-
      The accompanying preprint and formal development present a candidate
      extension of the established zero-dividend result to 0 ≤ q ≤ r. Novelty
      and priority have not been independently established. This package
      reuses the substantive proof in the parent directory, not a new proof.
  - title: Convexity of the exercise boundary of the American put option on a zero dividend asset
    authors: [Xinfu Chen, John Chadam, Lishang Jiang, Weian Zheng]
    type: paper
    relationship: background
    doi: 10.1111/j.1467-9965.2007.00328.x
    year: 2008
  - title: Nonconvexity of the optimal exercise boundary for an American put option on a dividend-paying asset
    authors: [Xinfu Chen, Huibin Cheng, John Chadam]
    type: paper
    relationship: background
    doi: 10.1111/j.1467-9965.2011.00500.x
    year: 2013
    note: Counterexamples concern dividend yields above the risk-free interest rate; no q > r claim is made here.
  - title: Convexity of the exercise boundary of the American put option
    authors: [Hsuan-Ku Liu]
    type: paper
    relationship: background
    url: https://arxiv.org/abs/1304.5337v7
    note: Identifies the intermediate positive-dividend convexity problem; cited as historical context, not a formal assumption.
