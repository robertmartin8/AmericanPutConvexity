automation:
  methods:
    - method: agent
      tool_setup: ChatGPT, Codex and Claude Code
      models: [ChatGPT-6 Pro (astra), Fable 5.1, gpt-6-astra high]
      notes: >-
        Historical model attribution is reported by the author: candidate proof
        development with Astra, checking with Fable 5.1, and formalization
